<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sunset Coven Clayworks</title>
  <style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --black: #0a0c0a;
    --deep: #0d1410;
    --forest: #1a2e1e;
    --moss: #2d4a32;
    --sage: #4a7255;
    --mist: #8aab8e;
    --blue: #1a2535;
    --blue-mid: #243548;
    --accent: #6b9e78;
    --gold: #c9a96e;
    --cream: #e8e2d5;
    --white: #f4f1ec;
  }

  body {
    background: var(--black);
    color: var(--cream);
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    overflow-x: hidden;
  }

  /* NAV */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: rgba(10,12,10,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(138,171,142,0.15);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 3rem;
    height: 70px;
  }
  .nav-logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.5rem;
    font-weight: 300;
    font-style: italic;
    color: var(--white);
    letter-spacing: 0.05em;
    cursor: pointer;
  }
  .nav-logo span { color: var(--accent); }
  .nav-links { display: flex; gap: 2rem; list-style: none; }
  .nav-links li {
    font-size: 0.7rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--mist);
    cursor: pointer;
    padding-bottom: 2px;
    border-bottom: 1px solid transparent;
    transition: all 0.3s;
  }
  .nav-links li:hover, .nav-links li.active {
    color: var(--white);
    border-bottom-color: var(--accent);
  }
  .hamburger {
    display: none; flex-direction: column; gap: 5px; cursor: pointer;
    background: none; border: none; padding: 4px;
  }
  .hamburger span {
    width: 24px; height: 1px; background: var(--mist); display: block; transition: all 0.3s;
  }
  .mobile-menu {
    display: none; position: fixed; top: 70px; left: 0; right: 0; bottom: 0;
    background: rgba(10,12,10,0.98); z-index: 99;
    flex-direction: column; align-items: center; justify-content: center; gap: 2.5rem;
  }
  .mobile-menu.open { display: flex; }
  .mobile-menu li {
    list-style: none; font-size: 1.5rem; letter-spacing: 0.15em; text-transform: uppercase;
    font-family: 'Cormorant Garamond', serif; color: var(--mist); cursor: pointer; transition: color 0.3s;
  }
  .mobile-menu li:hover { color: var(--white); }

  /* PAGE */
  .page { min-height: 100vh; padding-top: 70px; animation: fadeIn 0.6s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  /* HOME */
  .hero {
    min-height: calc(100vh - 70px);
    display: grid; grid-template-columns: 1fr 1fr;
    position: relative; overflow: hidden;
  }
  .hero-left {
    display: flex; flex-direction: column; justify-content: center;
    padding: 6rem 4rem 6rem 5rem;
    background: linear-gradient(135deg, var(--deep) 0%, var(--forest) 100%);
    position: relative;
  }
  .hero-left::after {
    content: ''; position: absolute; top: 0; right: 0; bottom: 0; width: 1px;
    background: linear-gradient(to bottom, transparent, var(--accent), transparent);
  }
  .hero-eyebrow {
    font-size: 0.65rem; letter-spacing: 0.3em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 1.5rem;
  }
  .hero-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(3rem, 5vw, 5.5rem);
    font-weight: 300; line-height: 1.05;
    color: var(--white); margin-bottom: 2rem;
  }
  .hero-title em { color: var(--accent); font-style: italic; }
  .hero-sub {
    font-size: 0.95rem; line-height: 1.8; color: var(--mist);
    max-width: 380px; margin-bottom: 3rem;
  }
  .btn {
    display: inline-block; padding: 0.85rem 2.2rem;
    border: 1px solid var(--accent); color: var(--accent);
    font-family: 'Jost', sans-serif; font-size: 0.7rem;
    letter-spacing: 0.2em; text-transform: uppercase;
    cursor: pointer; transition: all 0.3s; background: transparent;
  }
  .btn:hover { background: var(--accent); color: var(--black); }
  .btn-solid {
    background: var(--accent); color: var(--black); border: 1px solid var(--accent);
  }
  .btn-solid:hover { background: transparent; color: var(--accent); }

  .hero-right {
    background: var(--blue);
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
    gap: 3px; padding: 3px;
  }
  .hero-img-placeholder {
    background: var(--blue-mid);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 0.5rem; color: var(--mist); font-size: 0.65rem;
    letter-spacing: 0.15em; text-transform: uppercase;
    border: 1px solid rgba(138,171,142,0.08);
    transition: all 0.4s; cursor: pointer;
    position: relative; overflow: hidden;
  }
  .hero-img-placeholder::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(106,158,120,0.05), transparent);
  }
  .hero-img-placeholder:hover { border-color: rgba(138,171,142,0.3); }
  .hero-img-placeholder:first-child { grid-row: span 2; }
  .img-icon { font-size: 2rem; opacity: 0.3; }

  /* CONTACT SECTION */
  .contact-section {
    background: var(--deep);
    border-top: 1px solid rgba(138,171,142,0.12);
    padding: 6rem 5rem;
    display: grid; grid-template-columns: 1fr 1fr; gap: 6rem;
  }
  .section-label {
    font-size: 0.6rem; letter-spacing: 0.35em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 1.5rem;
  }
  .section-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2rem, 3.5vw, 3rem); font-weight: 300;
    color: var(--white); line-height: 1.15; margin-bottom: 1.5rem;
  }
  .contact-form { display: flex; flex-direction: column; gap: 1.2rem; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .form-group { display: flex; flex-direction: column; gap: 0.5rem; }
  .form-group label {
    font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--mist);
  }
  .form-group input, .form-group textarea, .form-group select {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(138,171,142,0.2);
    color: var(--white); padding: 0.85rem 1rem;
    font-family: 'Jost', sans-serif; font-size: 0.9rem; font-weight: 300;
    transition: border-color 0.3s; outline: none;
    border-radius: 0;
  }
  .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
    border-color: var(--accent);
  }
  .form-group textarea { resize: vertical; min-height: 120px; }
  .form-group select option { background: var(--deep); }
  .contact-info { display: flex; flex-direction: column; gap: 2rem; }
  .contact-item { border-left: 2px solid var(--moss); padding-left: 1.5rem; }
  .contact-item-label { font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin-bottom: 0.4rem; }
  .contact-item-value { font-size: 1rem; color: var(--cream); }

  /* CLASSES */
  .page-header {
    background: linear-gradient(135deg, var(--deep), var(--blue));
    padding: 5rem 5rem 4rem;
    border-bottom: 1px solid rgba(138,171,142,0.12);
  }
  .classes-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 1.5px; background: rgba(138,171,142,0.08);
    padding: 1.5px;
  }
  .class-card {
    background: var(--deep);
    padding: 2.5rem;
    border: 1px solid transparent;
    transition: all 0.4s; cursor: pointer;
    position: relative; overflow: hidden;
  }
  .class-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0; transition: opacity 0.4s;
  }
  .class-card:hover { background: rgba(26,46,30,0.8); }
  .class-card:hover::before { opacity: 1; }
  .class-badge {
    display: inline-block;
    font-size: 0.55rem; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--accent); border: 1px solid rgba(106,158,120,0.4);
    padding: 0.25rem 0.7rem; margin-bottom: 1.2rem;
  }
  .class-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.6rem; font-weight: 400; color: var(--white);
    margin-bottom: 0.8rem; line-height: 1.2;
  }
  .class-desc { font-size: 0.85rem; color: var(--mist); line-height: 1.75; margin-bottom: 1.5rem; }
  .class-meta { display: flex; gap: 2rem; margin-bottom: 1.5rem; }
  .class-meta-label { font-size: 0.55rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--sage); margin-bottom: 0.25rem; }
  .class-meta-value { font-size: 0.95rem; color: var(--cream); }
  .class-footer { display: flex; align-items: center; justify-content: space-between; }
  .class-price {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2rem; font-weight: 300; color: var(--white);
  }
  .class-price span { font-size: 0.8rem; color: var(--mist); font-family: 'Jost', sans-serif; }

  /* BOOKING MODAL */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    z-index: 200; display: flex; align-items: center; justify-content: center;
    padding: 2rem; animation: fadeIn 0.3s;
  }
  .modal {
    background: var(--deep); border: 1px solid rgba(138,171,142,0.2);
    max-width: 540px; width: 100%; padding: 3rem; position: relative;
    max-height: 90vh; overflow-y: auto;
  }
  .modal-close {
    position: absolute; top: 1.2rem; right: 1.2rem;
    background: none; border: none; color: var(--mist);
    font-size: 1.4rem; cursor: pointer; line-height: 1;
  }
  .modal-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2rem; font-weight: 300; color: var(--white); margin-bottom: 0.5rem;
  }
  .modal-sub { font-size: 0.85rem; color: var(--mist); margin-bottom: 2rem; }
  .success-msg {
    text-align: center; padding: 2rem;
    font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; color: var(--accent);
  }

  /* CHECK IT OUT (gallery) */
  .gallery-intro { padding: 4rem 5rem 2rem; }
  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 3px; padding: 0 1.5px 1.5px;
  }
  .gallery-item {
    aspect-ratio: 1;
    background: var(--blue-mid);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 0.7rem; color: var(--mist);
    font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase;
    border: 1px solid rgba(138,171,142,0.06);
    transition: all 0.4s; cursor: pointer; position: relative; overflow: hidden;
  }
  .gallery-item:hover { border-color: rgba(138,171,142,0.2); }
  .gallery-item.tall { grid-row: span 2; }
  .gallery-item.wide { grid-column: span 2; }
  .gallery-item img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.5s; }
  .gallery-item:hover img { transform: scale(1.04); }
  .gallery-upload-zone {
    margin: 2rem 5rem;
    border: 1px dashed rgba(138,171,142,0.3);
    padding: 3rem; text-align: center;
    color: var(--mist); font-size: 0.85rem;
    cursor: pointer; transition: all 0.3s;
  }
  .gallery-upload-zone:hover { border-color: var(--accent); color: var(--accent); }
  .upload-icon { font-size: 2.5rem; margin-bottom: 1rem; opacity: 0.4; }

  /* ABOUT */
  .about-layout {
    display: grid; grid-template-columns: 1fr 1.6fr;
    min-height: calc(100vh - 70px);
  }
  .about-left {
    background: var(--blue);
    padding: 5rem 3.5rem;
    border-right: 1px solid rgba(138,171,142,0.1);
    display: flex; flex-direction: column;
  }
  .about-portrait {
    width: 100%; aspect-ratio: 3/4; max-width: 320px;
    background: var(--blue-mid);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 0.7rem; margin-bottom: 2.5rem;
    border: 1px solid rgba(138,171,142,0.1);
    color: var(--mist); font-size: 0.65rem; letter-spacing: 0.15em;
  }
  .about-right {
    padding: 5rem 5rem 5rem 4rem;
    background: var(--deep);
  }
  .about-section { margin-bottom: 3.5rem; }
  .about-section:last-child { margin-bottom: 0; }
  .about-text { font-size: 1rem; line-height: 1.9; color: var(--mist); }
  .about-text + .about-text { margin-top: 1.2rem; }
  .values-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-top: 1.5rem; }
  .value-item {
    padding: 1.5rem; background: rgba(26,46,30,0.4);
    border: 1px solid rgba(138,171,142,0.12);
  }
  .value-item-title {
    font-family: 'Cormorant Garamond', serif; font-size: 1.1rem;
    color: var(--white); margin-bottom: 0.5rem;
  }
  .value-item-text { font-size: 0.8rem; color: var(--mist); line-height: 1.7; }

  /* STUDIO POLICY */
  .policy-layout { max-width: 860px; margin: 0 auto; padding: 5rem 3rem; }
  .policy-section {
    margin-bottom: 2.5rem;
    border-bottom: 1px solid rgba(138,171,142,0.1);
    padding-bottom: 2.5rem;
  }
  .policy-section:last-child { border-bottom: none; }
  .policy-section-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.4rem; font-weight: 400; color: var(--white);
    margin-bottom: 1rem; display: flex; align-items: center; gap: 1rem;
  }
  .policy-section-title::before {
    content: ''; display: block; width: 24px; height: 1px; background: var(--accent);
    flex-shrink: 0;
  }
  .policy-text { font-size: 0.9rem; color: var(--mist); line-height: 1.85; }
  .policy-list { list-style: none; display: flex; flex-direction: column; gap: 0.7rem; margin-top: 0.8rem; }
  .policy-list li {
    font-size: 0.9rem; color: var(--mist); line-height: 1.7;
    padding-left: 1.5rem; position: relative;
  }
  .policy-list li::before {
    content: '—'; position: absolute; left: 0; color: var(--accent);
  }

  /* EVENTS */
  .events-header { padding: 5rem 5rem 3rem; }
  .events-list { padding: 0 5rem 5rem; display: flex; flex-direction: column; gap: 1px; }
  .event-row {
    display: grid; grid-template-columns: 120px 1fr auto;
    align-items: center; gap: 2rem;
    background: rgba(26,30,26,0.6);
    border: 1px solid rgba(138,171,142,0.08);
    padding: 2rem 2.5rem;
    transition: all 0.3s; cursor: pointer; position: relative;
  }
  .event-row::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
    background: var(--accent); opacity: 0; transition: opacity 0.3s;
  }
  .event-row:hover { background: rgba(26,46,30,0.5); }
  .event-row:hover::before { opacity: 1; }
  .event-date-block { text-align: center; }
  .event-month { font-size: 0.6rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--accent); }
  .event-day {
    font-family: 'Cormorant Garamond', serif; font-size: 3rem; font-weight: 300;
    color: var(--white); line-height: 1;
  }
  .event-year { font-size: 0.7rem; color: var(--mist); }
  .event-name {
    font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; color: var(--white);
    margin-bottom: 0.4rem;
  }
  .event-location { font-size: 0.8rem; color: var(--mist); }
  .event-type {
    font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--sage); border: 1px solid rgba(74,114,85,0.4); padding: 0.3rem 0.8rem;
    white-space: nowrap;
  }
  .no-events {
    text-align: center; padding: 5rem 2rem;
    font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; color: var(--mist);
  }
  .add-event-form {
    margin: 0 5rem 3rem;
    background: var(--deep); border: 1px solid rgba(138,171,142,0.12);
    padding: 2.5rem;
  }
  .add-event-title {
    font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; color: var(--white); margin-bottom: 1.5rem;
  }

  /* DECORATIVE */
  .ornament {
    display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem;
  }
  .ornament-line { flex: 1; height: 1px; background: rgba(138,171,142,0.15); }
  .ornament-diamond {
    width: 6px; height: 6px; background: var(--accent);
    transform: rotate(45deg);
  }

  /* FOOTER */
  footer {
    background: var(--black);
    border-top: 1px solid rgba(138,171,142,0.1);
    padding: 3rem 5rem;
    display: flex; align-items: center; justify-content: space-between;
  }
  .footer-logo {
    font-family: 'Cormorant Garamond', serif; font-size: 1.2rem;
    font-style: italic; color: var(--mist);
  }
  .footer-copy { font-size: 0.7rem; color: rgba(138,171,142,0.4); letter-spacing: 0.1em; }

  @media (max-width: 900px) {
    nav { padding: 0 1.5rem; }
    .nav-links { display: none; }
    .hamburger { display: flex; }
    .hero { grid-template-columns: 1fr; }
    .hero-right { height: 50vw; }
    .hero-left { padding: 4rem 2rem; }
    .contact-section { grid-template-columns: 1fr; padding: 4rem 2rem; gap: 3rem; }
    .about-layout { grid-template-columns: 1fr; }
    .about-left { padding: 3rem 2rem; }
    .about-right { padding: 3rem 2rem; }
    .gallery-grid { grid-template-columns: repeat(2, 1fr); }
    .gallery-upload-zone, .events-header, .events-list, .gallery-intro { margin: 0; padding: 2rem; }
    .add-event-form { margin: 0 2rem 2rem; }
    .page-header { padding: 3rem 2rem; }
    .event-row { grid-template-columns: 80px 1fr; padding: 1.5rem; }
    .event-type { display: none; }
    footer { flex-direction: column; gap: 1rem; text-align: center; padding: 2rem; }
    .policy-layout { padding: 3rem 2rem; }
    .values-grid { grid-template-columns: 1fr; }
  }
  </style>
</head>
<body>

<nav id="mainNav">
  <div class="nav-logo" onclick="goTo('Home')">Sunset Coven <span>Clayworks</span></div>
  <ul class="nav-links" id="navLinks"></ul>
  <button class="hamburger" onclick="toggleMenu()">
    <span></span><span></span><span></span>
  </button>
</nav>

<ul class="mobile-menu" id="mobileMenu"></ul>

<div id="app"></div>

<!-- LIGHTBOX -->
<div id="lightbox" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.92); z-index:300; align-items:center; justify-content:center; padding:2rem;">
  <button onclick="closeLightbox()" style="position:absolute;top:1.5rem;right:1.5rem;background:none;border:none;color:var(--mist);font-size:1.8rem;cursor:pointer;line-height:1;">✕</button>
  <img id="lightboxImg" src="" alt="Artwork" onclick="event.stopPropagation()" style="max-width:90vw;max-height:88vh;object-fit:contain;border:1px solid rgba(138,171,142,0.15);" />
</div>

<!-- BOOKING MODAL -->
<div id="bookingOverlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:200; align-items:center; justify-content:center; padding:2rem; animation:fadeIn 0.3s;">
  <div class="modal">
    <button class="modal-close" onclick="closeBooking()">✕</button>
    <div id="bookingContent"></div>
  </div>
</div>

const SAMPLE_EVENTS = [
  { id: 1, month: "JUN", day: "07", year: "2026", name: "Riverside Artisan Market",     location: "Riverside Park Pavilion, Downtown",        type: "Farmers Market" },

];

// ── STATE ──────────────────────────────────────────────────────────────────
let page         = 'Home';
let menuOpen     = false;
let bookingClass = null;
let bookingSuccess = false;
let bookingForm  = { name: '', email: '', date: '', notes: '' };
let events       = [...SAMPLE_EVENTS];
let showAddEvent = false;
let newEvent     = { month:'', day:'', year:'', name:'', location:'', type:'' };
let contactSuccess = false;

// ── NAV ────────────────────────────────────────────────────────────────────
function buildNav() {
  const ul = document.getElementById('navLinks');
  const mob = document.getElementById('mobileMenu');
  ul.innerHTML = NAV_LABELS.map((label, i) =>
    `<li data-key="${NAV_KEYS[i]}" onclick="goTo('${NAV_KEYS[i]}')">${label}</li>`
  ).join('');
  mob.innerHTML = NAV_LABELS.map((label, i) =>
    `<li onclick="goTo('${NAV_KEYS[i]}')">${label}</li>`
  ).join('');
  updateActiveNav();
}

function updateActiveNav() {
  document.querySelectorAll('#navLinks li').forEach(li => {
    li.classList.toggle('active', li.dataset.key === page);
  });
}

function goTo(p) {
  page = p;
  menuOpen = false;
  contactSuccess = false;
  document.getElementById('mobileMenu').classList.remove('open');
  updateActiveNav();
  render();
  window.scrollTo(0, 0);
}

function toggleMenu() {
  menuOpen = !menuOpen;
  document.getElementById('mobileMenu').classList.toggle('open', menuOpen);
}

// ── LIGHTBOX ───────────────────────────────────────────────────────────────
function openLightbox(src) {
  document.getElementById('lightboxImg').src = src;
  const lb = document.getElementById('lightbox');
  lb.style.display = 'flex';
  lb.onclick = closeLightbox;
}
function closeLightbox() {
  document.getElementById('lightbox').style.display = 'none';
}

// ── BOOKING ────────────────────────────────────────────────────────────────
function openBooking(id) {
  bookingClass = CLASSES.find(c => c.id === id);
  bookingSuccess = false;
  bookingForm = { name:'', email:'', date:'', notes:'' };
  renderBookingModal();
  document.getElementById('bookingOverlay').style.display = 'flex';
  document.getElementById('bookingOverlay').onclick = function(e) {
    if (e.target === this) closeBooking();
  };
}
function closeBooking() {
  document.getElementById('bookingOverlay').style.display = 'none';
  bookingClass = null;
  bookingSuccess = false;
}
function confirmBooking() {
  bookingSuccess = true;
  renderBookingModal();
  setTimeout(() => { closeBooking(); }, 3000);
}
function renderBookingModal() {
  const el = document.getElementById('bookingContent');
  if (!bookingClass) return;
  if (bookingSuccess) {
    el.innerHTML = `<div class="success-msg">✦ You're booked!<br><span style="font-size:1rem;color:var(--mist);font-family:'Jost',sans-serif;">Check your email for confirmation details.</span></div>`;
  } else {
    el.innerHTML = `
      <div class="modal-title">${bookingClass.name}</div>
      <div class="modal-sub">${bookingClass.duration} · ${bookingClass.level} · $${bookingClass.price} per person</div>
      <div class="contact-form">
        <div class="form-group"><label>Full Name</label><input type="text" placeholder="Your name" id="bName" value="${bookingForm.name}" oninput="bookingForm.name=this.value"/></div>
        <div class="form-group"><label>Email</label><input type="email" placeholder="your@email.com" id="bEmail" value="${bookingForm.email}" oninput="bookingForm.email=this.value"/></div>
        <div class="form-group"><label>Preferred Date</label><input type="date" id="bDate" value="${bookingForm.date}" oninput="bookingForm.date=this.value"/></div>
        <div class="form-group"><label>Questions or Notes</label><textarea placeholder="Anything we should know?" oninput="bookingForm.notes=this.value">${bookingForm.notes}</textarea></div>
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <div style="font-family:'Cormorant Garamond',serif;font-size:1.8rem;color:var(--white);">$${bookingClass.price}</div>
          <button class="btn btn-solid" onclick="confirmBooking()">Confirm &amp; Pay</button>
        </div>
      </div>`;
  }
}

// ── EVENTS ─────────────────────────────────────────────────────────────────
function toggleAddEvent() {
  showAddEvent = !showAddEvent;
  render();
}
function addEvent() {
  const name     = document.getElementById('evName').value.trim();
  const location = document.getElementById('evLocation').value.trim();
  const month    = document.getElementById('evMonth').value.trim();
  const day      = document.getElementById('evDay').value.trim();
  const year     = document.getElementById('evYear').value.trim();
  const type     = document.getElementById('evType').value.trim();
  if (!name || !day || !month) return;
  events.push({ id: Date.now(), name, location, month, day, year, type });
  showAddEvent = false;
  render();
}

// ── CONTACT ────────────────────────────────────────────────────────────────
function submitContact() {
  contactSuccess = true;
  const area = document.getElementById('contactFormArea');
  if (area) area.innerHTML = `<div style="text-align:center;padding:4rem 2rem;font-family:'Cormorant Garamond',serif;font-size:1.5rem;color:var(--accent);">✦ Message sent — I'll be in touch soon.</div>`;
}

// ── RENDER ─────────────────────────────────────────────────────────────────
function render() {
  const app = document.getElementById('app');
  switch(page) {
    case 'Home':    app.innerHTML = renderHome();    break;
    case 'Classes': app.innerHTML = renderClasses(); break;
    case 'Gallery': app.innerHTML = renderGallery(); break;
    case 'About':   app.innerHTML = renderAbout();   break;
    case 'Policy':  app.innerHTML = renderPolicy();  break;
    case 'Events':  app.innerHTML = renderEvents();  break;
  }
}

// ── CLASSES ────────────────────────────────────────────────────────────────

// ── GALLERY ────────────────────────────────────────────────────────────────
function renderGallery() {
  const items = GALLERY_IMAGES.map((img, i) => {
    const tall = (i===0||i===6) ? 'tall' : '';

    return `<div class="gallery-item ${tall} ${wide}" style="padding:0;overflow:hidden;" onclick="openLightbox('${img.src}')">
      <img src="${img.src}" alt="Artwork ${img.id}"/>
    </div>`;
  }).join('');
  return `<div class="page">
    <div class="gallery-intro">
      <div class="section-label">Recent work</div>
      <h1 class="section-title" style="font-size:clamp(2.5rem,4vw,4rem);">Check It Out</h1>

// ── POLICY ─────────────────────────────────────────────────────────────────

  const sections = POLICIES.map(p => `

    <div style="background:linear-gradient(135deg,var(--deep),var(--blue));padding:5rem 5rem 4rem;border-bottom:1px solid rgba(138,171,142,0.12);">

      </div>
    </div>
    <footer><div class="footer-logo">Sunset Coven Clayworks</div><div class="footer-copy">© 2026 · All rights reserved</div></footer>
  </div>`;
}

// ── EVENTS ─────────────────────────────────────────────────────────────────
function renderEvents() {
  const addForm = showAddEvent ? `
    <div class="add-event-form">
      <div class="add-event-title">Add a New Event</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:1rem;margin-bottom:1.2rem;">
        <div class="form-group"><label>Event Name</label><input id="evName" type="text" placeholder="Market or show name"/></div>
        <div class="form-group"><label>Location</label><input id="evLocation" type="text" placeholder="Venue, City"/></div>
        <div class="form-group"><label>Month (e.g. JUL)</label><input id="evMonth" type="text" placeholder="JUL"/></div>
        <div class="form-group"><label>Day</label><input id="evDay" type="text" placeholder="15"/></div>
        <div class="form-group"><label>Year</label><input id="evYear" type="text" placeholder="2026"/></div>
        <div class="form-group"><label>Type</label><input id="evType" type="text" placeholder="Farmers Market, Art Fair…"/></div>
      </div>
      <button class="btn btn-solid" onclick="addEvent()">Add Event</button>
    </div>` : '';

  const eventRows = events.length === 0
    ? `<div class="no-events">No upcoming events yet — check back soon.</div>`
    : events.map(e => `
        <div class="event-row">
          <div class="event-date-block">
            <div class="event-month">${e.month}</div>
            <div class="event-day">${e.day}</div>
            <div class="event-year">${e.year}</div>
          </div>
          <div class="event-info">
            <div class="event-name">${e.name}</div>
            <div class="event-location">📍 ${e.location}</div>
          </div>
          <div class="event-type">${e.type}</div>

  return `<div class="page">
    <div class="events-header">
      <div class="section-label">Find me in the wild</div>
      <h1 class="section-title" style="font-size:clamp(2.5rem,4vw,4rem);">Upcoming Events</h1>
      <p style="font-size:0.95rem;color:var(--mist);line-height:1.8;max-width:560px;margin-top:0.8rem;margin-bottom:2rem;">Come find me at markets, art fairs, and shows. I bring a rotating selection of studio work — always a few things you won't find anywhere else.</p>

    <footer><div class="footer-logo">Sunset Coven Clayworks</div><div class="footer-copy">© 2026 · All rights reserved</div></footer>
  </div>`;
}

// ── INIT ───────────────────────────────────────────────────────────────────
buildNav();
render();
</script>
